name: Watch DeepSeek Harness releases

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const compatibility = JSON.parse(fs.readFileSync('compatibility.json', 'utf8'))
            const supported = new Set(compatibility.tested.map(item => item.dsh))
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: 'deepseek-ai', repo: 'deepseek-harness', per_page: 30
            })
            const candidates = releases
              .map(release => ({ release, version: release.tag_name.replace(/^dsh-v/, '') }))
              .filter(item => /^0\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(item.version))
            const latest = candidates[0]
            if (!latest || supported.has(latest.version)) return
            const title = `[compat] Test DeepSeek Harness ${latest.version}`
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100
            })
            if (existing.some(issue => issue.title === title)) return
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: [
                `Upstream released [${latest.release.tag_name}](${latest.release.html_url}).`,
                '',
                'Compatibility is not assumed. Create a dedicated branch, set `dsh.engines.dsh` to the exact version, and run `node scripts/compat-smoke.mjs` before publishing.',
                '',
                `Current primary target remains DSH ${compatibility.primary.dsh} on \`${compatibility.primary.ref}\`.`
              ].join('\n')
            })
